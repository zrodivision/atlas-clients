name: Publish GitHub release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/native.yml
  prerelease:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run format:check && npm run plugins:generate -- --check
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-native-*
          path: release-assets
          merge-multiple: true
      - id: package
        run: |
          node --import tsx scripts/package-release.ts > release-result.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(!/^\d+\.\d+\.\d+$/.test(p.version)) throw Error("Stable release version required"); const r=JSON.parse(fs.readFileSync("release-result.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${p.version}\ntarball=${r.tarball}\n`);'
          test "$(find release-assets -name '*.tar.gz' | wc -l)" -eq 4
          cat release-assets/*.sha256 > release-assets/SHASUMS256.txt
          cd release-assets
          sha256sum -c SHASUMS256.txt
      - name: Publish tested release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_TAG: ${{ steps.package.outputs.tag }}
          ATLAS_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          gh release create "$ATLAS_TAG" "$ATLAS_TARBALL" release-assets/*.tar.gz release-assets/SHASUMS256.txt install.sh update.sh --target "$GITHUB_SHA" --draft --title "Atlas $ATLAS_TAG" --notes "Standalone macOS/Linux x64/ARM64 CLI, bundled Atlas skill, verified installer and explicit updater. No Node/npm required. Compatible with Atlas service 0.7.0. Service deployment is verified separately. This release does not deploy the service or publish npm. See README for install and update commands."
          gh release edit "$ATLAS_TAG" --draft=false
